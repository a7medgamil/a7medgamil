name: GitHub profile visual integrity
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/check-profile-assets.mjs'
      - 'scripts/check-profile-assets.test.mjs'
      - 'scripts/check-profile-motion.mjs'
      - 'scripts/build-profile-motion.py'
      - 'scripts/build-github-signal.py'
      - 'scripts/build-live-profile.cjs'
      - 'scripts/build-live-hero.cjs'
      - 'scripts/enable-live-profile.py'
      - 'scripts/optimize-live-profile.py'
      - 'scripts/check-live-profile.mjs'
      - 'scripts/check-cinematic-dossier.mjs'
      - 'scripts/check-studio3d.mjs'
      - 'scripts/check-geometric-intelligence.mjs'
      - 'scripts/generate-isometric-cubes.py'
      - 'scripts/apply-isometric-cubes.py'
      - '.github/workflows/profile-visual-assets.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/check-profile-assets.mjs'
      - 'scripts/check-profile-assets.test.mjs'
      - 'scripts/check-profile-motion.mjs'
      - 'scripts/build-profile-motion.py'
      - 'scripts/build-github-signal.py'
      - 'scripts/build-live-profile.cjs'
      - 'scripts/build-live-hero.cjs'
      - 'scripts/enable-live-profile.py'
      - 'scripts/optimize-live-profile.py'
      - 'scripts/check-live-profile.mjs'
      - 'scripts/check-cinematic-dossier.mjs'
      - 'scripts/check-studio3d.mjs'
      - 'scripts/check-geometric-intelligence.mjs'
      - 'scripts/generate-isometric-cubes.py'
      - 'scripts/apply-isometric-cubes.py'
      - '.github/workflows/profile-visual-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-profile-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Run independent negative tests without packages/network
        run: node --test scripts/check-profile-assets.test.mjs
      - name: Check every README visual path exists in the current commit
        run: node scripts/check-profile-assets.mjs
      - name: Ensure all responsive motion designs preserve static originals and accessibility
        run: node scripts/check-profile-motion.mjs
      - name: Verify all luminous GIFs, reduced-motion originals, and executive sections
        run: node scripts/check-live-profile.mjs
      - name: Verify historical art remains available
        run: node scripts/check-cinematic-dossier.mjs
      - name: Verify previous genuine Blender 3D artwork is safely archived
        run: node scripts/check-studio3d.mjs
      - name: Verify the new spectral geometric 3D scenes and preserve all original profile information
        run: node scripts/check-geometric-intelligence.mjs
